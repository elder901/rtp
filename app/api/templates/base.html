<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTP — Reforma Tributária</title>
<style>
  :root { --fundo:#f6f7f9; --card:#fff; --texto:#1c2430; --suave:#5b6675; --borda:#e1e5ea;
          --azul:#1f3864; --sobe:#b42318; --desce:#067647; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui, "Segoe UI", sans-serif; background:var(--fundo); color:var(--texto); }
  header { background:var(--azul); color:#fff; padding:14px 24px; }
  header a { color:#fff; text-decoration:none; font-weight:600; }
  main { max-width:1200px; margin:0 auto; padding:24px 16px; }
  .card { background:var(--card); border:1px solid var(--borda); border-radius:8px; padding:20px; margin-bottom:20px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:0 0 12px; }
  .suave { color:var(--suave); }
  .grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  label { display:block; font-weight:600; font-size:13px; margin-bottom:4px; }
  input, select { width:100%; padding:8px; border:1px solid var(--borda); border-radius:6px; font:inherit; }
  button, .botao { background:var(--azul); color:#fff; border:0; border-radius:6px; padding:10px 18px; font:inherit;
                   font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  .tabela { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { padding:6px 10px; border-bottom:1px solid var(--borda); text-align:right; white-space:nowrap; }
  th { font-size:12px; color:var(--suave); font-weight:600; }
  th:first-child, td:first-child, td.txt, th.txt { text-align:left; }
  .sobe { color:var(--sobe); font-weight:600; } .desce { color:var(--desce); font-weight:600; }
  .alerta { background:#fffaeb; border:1px solid #fedf89; border-radius:6px; padding:8px 12px; margin:6px 0; }
  .tag { font-size:11px; padding:1px 6px; border-radius:10px; background:#eef2f6; color:var(--suave); }
</style>
</head>
<body>
<header><a href="/">RTP · Planejamento da Reforma Tributária</a></header>
<main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
